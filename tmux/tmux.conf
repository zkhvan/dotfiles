# tmux/tmux.conf

# ============================================================================
# Environment
# ============================================================================

set-option          -g  allow-passthrough  on
set-option          -g  set-clipboard      on

set-option          -g extended-keys        on
set-option          -g extended-keys-format csi-u

set-option          -sa terminal-features ",xterm-ghostty:RGB"
set-option          -sa terminal-features ",xterm-ghostty:extkeys"
set-option          -sa terminal-features ",*:hyperlinks"

# Make sure some vars are forwarded from parent shell to tmux
set-option          -ga update-environment " TERM_PROGRAM"
set-option          -ga update-environment " COLORTERM"

# for vim, focus pane on event like filemodified alerts
set-option          -g  focus-events        on

set-option          -g  history-limit       10000

# Set repeat time to enable holding key for pane resizing
set-option          -g  repeat-time         650

set-option          -g  @shell_mode         'vi'


# ============================================================================
# Notify
# ============================================================================

# No bells at all
set -g bell-action none

# ============================================================================
# Display settings
# ============================================================================

# Resize panes immediately for all clients
set-window-option -g aggressive-resize on

# Check for activity and set status
set-window-option -g monitor-activity on
set-option        -g visual-activity on

# ----------------------------------------------------------------------------
# Keycodes
# ----------------------------------------------------------------------------

set-window-option   -g  xterm-keys              on

# Reduce delay
set-option          -gs escape-time             1

# ----------------------------------------------------------------------------
# Reload tmux.conf
# ----------------------------------------------------------------------------

bind    r   source-file "${DOTFILES}/tmux/tmux.conf" \; display "R!"

# ============================================================================
# Title
# ============================================================================

set-option          -g  set-titles              on
set-option          -g  set-titles-string       "#P:#W in #S on #H"

set-option          -g  status-interval 5
set-option          -g  automatic-rename on
set-option          -g  automatic-rename-format "#{b:pane_current_path}"

# ============================================================================
# Statusline
# ============================================================================

# Status bar on top -- looks better when vim active since commandline is at
# bottom
set-option          -g  status-position         top

# Update status more often (1 sec)
set-option          -gs status-interval         1

# ----------------------------------------------------------------------------
# Contents
# ----------------------------------------------------------------------------

set-option          -g  status-justify          left
set-option          -g  status-left             '  '
set-option          -g  status-right            '  #[fg=colour252]#S#[default]  [^B]  '

set-window-option   -g  window-status-format          "#[fg=colour241] #I:#W "
set-window-option   -g  window-status-current-format  "#[fg=colour253,bg=colour239,bold] #I:#W "

# ----------------------------------------------------------------------------
# Start numbering from 1
# ----------------------------------------------------------------------------

set-option          -g  base-index              1
set-window-option   -g  pane-base-index         1
set-option          -g  renumber-windows        on

# ----------------------------------------------------------------------------
# Vim-style splitting, (v)ertical and horizontal (s)plit (and unbind defaults)
# ----------------------------------------------------------------------------

bind    v     split-window -h -c "#{pane_current_path}"
unbind  '"'
bind    s     split-window -v -c "#{pane_current_path}"
unbind  %
bind    c     new-window      -c "#{pane_current_path}"
bind    a     choose-session

# ----------------------------------------------------------------------------
# Show/hide pane
# ----------------------------------------------------------------------------

bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.1 -h

# ----------------------------------------------------------------------------
# Pre-defined layouts
# ----------------------------------------------------------------------------
bind                      t     switch-client -T select-layouts
bind    -T select-layouts 1     select-layout "cd5c,238x81,0,0[238x16,0,0{118x16,0,0,138,119x16,119,0,140},238x64,0,17{159x64,0,17,139,78x64,160,17,143}]"
bind    -T select-layouts 2     select-layout "dd9a,238x81,0,0[238x16,0,0{118x16,0,0,27,119x16,119,0,29},238x51,0,17,28,238x12,0,69,37]"

bind                      C-t   switch-client -T create-layouts
bind    -T create-layouts 1     split-window -t 1                        -v -p 80 -d \; \
                                split-window -t "{top}"                  -h -p 50 -d \; \
                                split-window -t "{bottom}"               -h -p 33 -d

# ----------------------------------------------------------------------------
# Vim-style pane navigation
# C-* variants so can hold ctrl down
# ----------------------------------------------------------------------------

bind    h     select-pane -L
bind  C-h     select-pane -L
bind    j     select-pane -D
bind  C-j     select-pane -D
bind    k     select-pane -U
bind  C-k     select-pane -U
bind    l     select-pane -R
bind  C-l     select-pane -R

# ----------------------------------------------------------------------------
# Seamless Neovim <-> tmux navigation (Alt + arrow keys)
#
# Same keys move between tmux panes and Neovim splits; also works over SSH.
# Requires the matching 'titlestring' in Neovim (nvim/lua/zkhvan/opt.lua).
# Source: https://sunaku.github.io/tmux-select-pane.html
#
#   +-------------+------------+-----------------------------+
#   | inside Vim? | is Zoomed? | Action taken by key binding |
#   +-------------+------------+-----------------------------+
#   | No          | No         | Focus directional tmux pane |
#   | No          | Yes        | Nothing: ignore key binding |
#   | Yes         | No         | Seamlessly focus Vim / tmux |
#   | Yes         | Yes        | Focus directional Vim split |
#   +-------------+------------+-----------------------------+
# ----------------------------------------------------------------------------

vim_navigation_timeout=0.05 # number of seconds we give Vim to navigate
navigate='                                                             \
  pane_title="#{q:pane_title}";                                        \
  pane_current_command="#{q:pane_current_command}";                    \
  pane_is_zoomed() {                                                   \
    test #{window_zoomed_flag} -eq 1;                                  \
  };                                                                   \
  pane_title_changed() {                                               \
    test "$pane_title" != "$(tmux display -p "##{q:pane_title}")";     \
  };                                                                   \
  command_is_vim() {                                                   \
    case "${1%% *}" in                                                 \
      (vi|?vi|vim*|?vim*|view|?view|vi??*) true ;;                     \
      (*) false ;;                                                     \
    esac;                                                              \
  };                                                                   \
  pane_contains_vim() {                                                \
    case "$pane_current_command" in                                    \
      (git|*sh) command_is_vim "$pane_title" ;;                        \
      (*) command_is_vim "$pane_current_command" ;;                    \
    esac;                                                              \
  };                                                                   \
  pane_contains_neovim_terminal() {                                    \
    case "$pane_title" in                                              \
      (nvim?term://*) true ;;                                          \
      (*) false ;;                                                     \
    esac;                                                              \
  };                                                                   \
  navigate() {                                                         \
    tmux_navigation_command=$1;                                        \
    vim_navigation_command=$2;                                         \
    vim_navigation_only_if=${3:-true};                                 \
    if pane_contains_vim && eval "$vim_navigation_only_if"; then       \
      if pane_contains_neovim_terminal; then                           \
        tmux send-keys C-\\ C-n;                                       \
      fi;                                                              \
      eval "$vim_navigation_command";                                  \
      if ! pane_is_zoomed; then                                        \
        sleep $vim_navigation_timeout; : wait for Vim to change title; \
        if ! pane_title_changed; then                                 \
          eval "$tmux_navigation_command";                             \
        fi;                                                            \
      fi;                                                              \
    elif ! pane_is_zoomed; then                                        \
      eval "$tmux_navigation_command";                                 \
    fi;                                                                \
  };                                                                   \
navigate '
navigate_left=" $navigate 'tmux select-pane -L'  'tmux send-keys C-w h'"
navigate_down=" $navigate 'tmux select-pane -D'  'tmux send-keys C-w j'"
navigate_up="   $navigate 'tmux select-pane -U'  'tmux send-keys C-w k'"
navigate_right="$navigate 'tmux select-pane -R'  'tmux send-keys C-w l'"

bind-key -n M-Left  run-shell -b "$navigate_left"
bind-key -n M-Down  run-shell -b "$navigate_down"
bind-key -n M-Up    run-shell -b "$navigate_up"
bind-key -n M-Right run-shell -b "$navigate_right"

# ----------------------------------------------------------------------------
# Move panes (Alt + Shift + arrow keys)
#
# Swap the current pane with its neighbour in that direction; focus follows
# the pane, and movement wraps around at edges.
# ----------------------------------------------------------------------------

bind-key -n M-S-Left  swap-pane -s '{left-of}'
bind-key -n M-S-Down  swap-pane -s '{down-of}'
bind-key -n M-S-Up    swap-pane -s '{up-of}'
bind-key -n M-S-Right swap-pane -s '{right-of}'

# ----------------------------------------------------------------------------
# Vim-style pane resizing
# ----------------------------------------------------------------------------

bind                            H               resize-pane -L 4
bind    -r -T prefix            H               resize-pane -L 4
bind                            J               resize-pane -D 4
bind    -r -T prefix            J               resize-pane -D 4
bind                            K               resize-pane -U 4
bind    -r -T prefix            K               resize-pane -U 4
bind                            L               resize-pane -R 4
bind    -r -T prefix            L               resize-pane -R 4

# ----------------------------------------------------------------------------
# Last session
# ----------------------------------------------------------------------------
bind       -T prefix            BSpace          switch-client -l

# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
bind       -T prefix            C-o             display-popup -E "z project select --tmux --local"
bind       -T prefix            C-p             display-popup -E "z tmux session use"
bind       -T prefix            -               \
  confirm-before -p "kill session? (y/n)"    "run-shell \"z tmux session kill\""
bind       -T prefix            `               run-shell "z tmux popup use scratch"
bind       -T prefix            C-i             run-shell "z tmux popup use agent"
bind       -T prefix            C-c             run-shell "z tmux popup use claude"

# ----------------------------------------------------------------------------
# urls
# ----------------------------------------------------------------------------

bind       -T prefix            C-u             \
  run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"

# ============================================================================
# Text-to-speech (macOS)
# ============================================================================

bind-key -T copy-mode-vi S send-keys -X copy-pipe "${DOTFILES}/bin/tmux-say"

bind-key -T prefix S display-menu -T "Speech" \
  "Stop"           s "run-shell 'killall say 2>/dev/null; true'" \
  ""               "" "" \
  "Slow   (100)"   1 "set-environment SPEAK_RATE 200" \
  "Normal (200)"   2 "set-environment SPEAK_RATE 400" \
  "Fast   (300)"   3 "set-environment SPEAK_RATE 800" \
  "Turbo  (400)"   4 "set-environment SPEAK_RATE 1600"

# ============================================================================
# tmux version specific
# ============================================================================

run-shell "${DOTFILES}/tmux/versions.bash"

# vim: ft=tmux

